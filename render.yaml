services:
  # A Web Service for the REDORA FastAPI backend
  - type: web
    name: redora-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDirectory: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9 # Force stable Python version to download pre-compiled binary wheels instantly!
      - key: DATABASE_URL
        sync: false # Set this to your Supabase transaction pooler URL
      - key: GROQ_API_KEY
        sync: false # Set your Groq API Key
      - key: GOOGLE_CLIENT_ID
        sync: false # Set Google OAuth Client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set Google OAuth Client Secret
      - key: SECRET_KEY
        generateValue: true # Render will automatically generate a secure random cryptographic key for you!
      - key: ALLOWED_ORIGINS
        sync: false # Set to your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: QDRANT_URL
        sync: false # Optional: Set to your Qdrant Cloud URL
      - key: QDRANT_API_KEY
        sync: false # Optional: Set to your Qdrant Cloud API Key
